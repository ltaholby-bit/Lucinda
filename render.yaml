# One-click deploy on Render (https://render.com). Set ADMIN_PASSWORD and BASE_URL in the dashboard.
services:
  - type: web
    name: nolle-luxury-hair
    runtime: node
    rootDir: nolle
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
      - key: BASE_URL
        sync: false
    disk:
      name: shop-data
      mountPath: /var/data
      sizeGB: 1
