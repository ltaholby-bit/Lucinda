# One-click deploy on Render (https://render.com). Set ADMIN_PASSWORD in the dashboard,
# then add the custom domain nolleluxuryhair.co.za (and www.) under Settings -> Custom Domains.
services:
  - type: web
    name: nolle-luxury-hair
    runtime: node
    rootDir: nolle
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
      - key: BASE_URL
        value: https://nolleluxuryhair.co.za
    disk:
      name: shop-data
      mountPath: /var/data
      sizeGB: 1
